# Status board data. Edit one line per change; `npm run build` rejects unknown keys and states.
# Cell: `state note`. States: done (verified on the target) · built (works, unverified) · wip · plan · broken · na. Store rows: live · review · beta.
# A blank cell counts as missing; use na where a feature cannot apply. Keys come from `columns`: family, platform or device; the most specific wins.
# Metric rows have `unit` (optional `better: low`) and cells `number note`. Quote a cell that contains a comma or `: `.

